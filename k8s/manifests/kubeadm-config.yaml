# kubeadm configuration for the control plane on k8-control.
# Used by control-plane-init.sh.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 192.168.1.170
  bindPort: 6443
nodeRegistration:
  name: k8-control
  criSocket: unix:///run/containerd/containerd.sock
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.36.5
clusterName: k8-1apx
# A DNS name rather than an IP, so more control-plane nodes can be added later
controlPlaneEndpoint: k8-control.1apx.com:6443
networking:
  # Must not overlap the LAN (192.168.1.0/24)
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  dnsDomain: cluster.local
apiServer:
  certSANs:
    - k8-control
    - k8-control.1apx.com
    - 192.168.1.170
  extraArgs:
    # Secrets encrypted in etcd; control-plane-init.sh writes this file with a new key
    - name: encryption-provider-config
      value: /etc/kubernetes/enc/encryption-config.yaml
    # Audit log of API changes (policy: audit-policy.yaml, copied by control-plane-init.sh)
    - name: audit-policy-file
      value: /etc/kubernetes/audit/policy.yaml
    - name: audit-log-path
      value: /var/log/kubernetes/audit/audit.log
    - name: audit-log-maxage
      value: "30"
    - name: audit-log-maxbackup
      value: "10"
    - name: audit-log-maxsize
      value: "100"
  extraVolumes:
    - name: encryption-config
      hostPath: /etc/kubernetes/enc
      mountPath: /etc/kubernetes/enc
      readOnly: true
      pathType: Directory
    - name: audit-policy
      hostPath: /etc/kubernetes/audit
      mountPath: /etc/kubernetes/audit
      readOnly: true
      pathType: Directory
    - name: audit-log
      hostPath: /var/log/kubernetes/audit
      mountPath: /var/log/kubernetes/audit
      readOnly: false
      pathType: DirectoryOrCreate
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
