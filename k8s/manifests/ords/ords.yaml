# ORDS: two stateless replicas, normally one per worker, behind a MetalLB LAN IP, serving HTTPS
# with the *.1apx.com certificate. Applied by deploy-ords.sh, which replaces
# __ORDS_IMAGE__, __ORDS_HOSTNAME__, __LB_IP__ and __CONFIG_HASH__.
#
# Each pod builds its own ORDS config in an emptyDir at start, from:
#   ords-db ConfigMap        database host/port/service and APEX version
#   ords-settings ConfigMap  ords-settings.conf (settings copied from the old server)
#   ords-db-runtime Secret   ORDS_PUBLIC_USER password
#   ords-tls Secret          certificate chain and private key
# No shared storage is needed, and the SYS password is never given to these pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ords
  namespace: ords
  labels:
    app: ords
    app.kubernetes.io/name: ords
    app.kubernetes.io/part-of: ords
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ords
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ords
        app.kubernetes.io/name: ords
        app.kubernetes.io/part-of: ords
      annotations:
        # Hash of the ConfigMaps and Secrets below: a change replaces the pods
        ords.1apx.com/config-hash: "__CONFIG_HASH__"
    spec:
      hostAliases: []                # filled in by deploy-ords.sh when DB_HOST_IP is set
      automountServiceAccountToken: false   # ORDS doesn't use the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 54321            # "oracle" user in the ORDS image
        fsGroup: 54321
        seccompProfile:
          type: RuntimeDefault
      # Prefer one replica per worker. ScheduleAnyway (not DoNotSchedule) lets both run
      # on one worker while the other is drained or down, instead of one staying Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ords
      initContainers:
        # APEX static images (/i/), downloaded once per worker and kept in /var/cache/ords-apex,
        # which node-prep.sh creates owned by the oracle user
        - name: apex-images
          image: __ORDS_IMAGE__
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ -z "${APEX_VERSION:-}" ]; then echo "APEX_VERSION not set, no APEX images"; exit 0; fi
              dir="/apex-cache/$APEX_VERSION"
              if [ -f "$dir/.complete" ]; then echo "APEX $APEX_VERSION images already on this node"; exit 0; fi
              tmp="$dir.tmp.$HOSTNAME"
              rm -rf "$tmp" && mkdir -p "$tmp" && cd "$tmp"
              echo "Downloading APEX $APEX_VERSION images..."
              curl -fsSL --retry 3 -o apex.zip "https://download.oracle.com/otn_software/apex/apex_${APEX_VERSION}.zip"
              if command -v unzip >/dev/null; then unzip -q apex.zip 'apex/images/*'; else jar xf apex.zip apex/images; fi
              chmod -R a+rX apex/images && touch apex/images/.complete
              # Another pod on this node may have finished first: never replace a complete
              # folder, and move ours into place in one step so it's never seen half-written
              if [ -f "$dir/.complete" ]; then
                echo "APEX $APEX_VERSION images were installed by another pod"
              else
                rm -rf "$dir" && mv apex/images "$dir"
                echo "APEX $APEX_VERSION images ready"
              fi
              cd / && rm -rf "$tmp"
          envFrom:
            - configMapRef:
                name: ords-db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: apex-cache
              mountPath: /apex-cache
        # Writes the ORDS config for this pod
        - name: config
          image: __ORDS_IMAGE__
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              c="ords --config /etc/ords/config config"
              $c set db.hostname "$DB_HOST"
              $c set db.port "$DB_PORT"
              $c set db.servicename "$DB_SERVICE"
              grep -vE '^[[:space:]]*(#|$)' /etc/ords-settings/ords-settings.conf | while read -r key value; do
                $c set "$key" "$value"
              done
              $c set standalone.http.port 8080
              $c set standalone.https.port 8443
              $c set standalone.https.cert /run/secrets/ords-tls/tls.crt
              $c set standalone.https.cert.key /run/secrets/ords-tls/tls.key
              if [ -n "${APEX_VERSION:-}" ]; then
                $c set standalone.static.path "/opt/oracle/apex-cache/$APEX_VERSION"
              fi
              pw=$(cat /run/secrets/ords-runtime/ORACLE_USER_PWD)
              printf '%s\n%s\n' "$pw" "$pw" | $c secret db.password
          envFrom:
            - configMapRef:
                name: ords-db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/ords/config
            - name: settings
              mountPath: /etc/ords-settings
              readOnly: true
            - name: runtime
              mountPath: /run/secrets/ords-runtime
              readOnly: true
      containers:
        - name: ords
          image: __ORDS_IMAGE__
          # Runs ORDS directly instead of the image's entrypoint, which would switch
          # Database Actions, REST-enabled SQL and the MongoDB API on at every start.
          command: ["ords", "--config", "/etc/ords/config", "serve"]
          ports:
            - name: https
              containerPort: 8443
            - name: http             # only redirects to HTTPS (security.forceHTTPS)
              containerPort: 8080
          # On shutdown, keep serving for a few seconds while the Service and MetalLB
          # stop sending new connections here, so rolling updates don't drop requests
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 3Gi
          # Probes use HTTPS with the real hostname: ORDS rejects HTTPS requests whose
          # Host doesn't match the certificate, and plain HTTP only redirects.
          # /apps/ answers as soon as ORDS is listening, even if the database is down.
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /apps/
              port: https
              httpHeaders:
                - name: Host
                  value: __ORDS_HOSTNAME__
            periodSeconds: 10
            failureThreshold: 30     # up to 5 minutes
          # The landing page returns 571 when ORDS can't reach the database,
          # so a pod only receives traffic while its connection pool works
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /apps/_/landing
              port: https
              httpHeaders:
                - name: Host
                  value: __ORDS_HOSTNAME__
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ords/config
            - name: tls
              mountPath: /run/secrets/ords-tls
              readOnly: true
            - name: apex-cache
              mountPath: /opt/oracle/apex-cache
              readOnly: true
      volumes:
        - name: config
          emptyDir: {}
        - name: settings
          configMap:
            name: ords-settings
        - name: runtime
          secret:
            secretName: ords-db-runtime
        - name: tls
          secret:
            secretName: ords-tls
            defaultMode: 0440        # readable by the oracle group (fsGroup), not others
        - name: apex-cache
          hostPath:
            path: /var/cache/ords-apex
            type: Directory          # created by node-prep.sh, owned by UID 54321
---
# Keep at least one ORDS pod running during node drains and upgrades
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ords
  namespace: ords
  labels:
    app.kubernetes.io/name: ords
    app.kubernetes.io/part-of: ords
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ords
---
apiVersion: v1
kind: Service
metadata:
  name: ords
  namespace: ords
  labels:
    app.kubernetes.io/name: ords
    app.kubernetes.io/part-of: ords
  annotations:
    metallb.io/loadBalancerIPs: __LB_IP__
spec:
  type: LoadBalancer
  # MetalLB answers on the LAN IP directly, so no NodePorts need to be opened
  allocateLoadBalancerNodePorts: false
  selector:
    app: ords
  # APEX and Database Actions keep sessions in the ORDS process, so keep each client on one pod
  sessionAffinity: ClientIP
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: http             # redirects to https://
      port: 80
      targetPort: http
