# ORDS: two stateless replicas, normally one per worker, behind a MetalLB LAN IP, serving HTTPS
# with the *.1apx.com certificate. Applied by deploy-ords.sh, which fills in the image,
# host name, LoadBalancer IP and config hash (the double-underscore placeholders).
#
# Each pod builds its own ORDS config in an emptyDir at start, from:
#   ords-db ConfigMap        database host/port/service and APEX version
#   ords-settings ConfigMap  ords-settings.conf (settings copied from the old server)
#   ords-db-runtime Secret   ORDS_PUBLIC_USER password
#   ords-tls Secret          certificate chain and private key
# No shared storage is needed, and the SYS password is never given to these pods.
# Every container has a read-only root filesystem: they write only to their emptyDir volumes
# (config, APEX images, /tmp), so the namespace can enforce Pod Security "restricted".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ords
  namespace: ords
  labels:
    app: ords
    app.kubernetes.io/name: ords
    app.kubernetes.io/part-of: ords
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ords
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ords
        app.kubernetes.io/name: ords
        app.kubernetes.io/part-of: ords
      annotations:
        # Hash of the ConfigMaps and Secrets below: a change replaces the pods
        1apx.com/config-hash: "__CONFIG_HASH__"
    spec:
      hostAliases: []                # filled in by deploy-ords.sh when DB_HOST_IP is set
      automountServiceAccountToken: false   # ORDS doesn't use the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 54321            # "oracle" user in the ORDS image
        fsGroup: 54321
        seccompProfile:
          type: RuntimeDefault
      # Prefer one replica per worker. ScheduleAnyway (not DoNotSchedule) lets both run
      # on one worker while the other is drained or down, instead of one staying Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ords
      initContainers:
        # APEX static images (/i/), downloaded from Oracle into this pod's apex-images volume
        # each time the pod starts (about 290 MB; 480 MB unpacked)
        - name: apex-images
          image: __ORDS_IMAGE__
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ -z "${APEX_VERSION:-}" ]; then echo "APEX_VERSION not set, no APEX images"; exit 0; fi
              cd /apex-images
              echo "Downloading APEX $APEX_VERSION images..."
              curl -fsSL --retry 3 -o apex.zip "https://download.oracle.com/otn_software/apex/apex_${APEX_VERSION}.zip"
              if command -v unzip >/dev/null; then unzip -q apex.zip 'apex/images/*'; else jar xf apex.zip apex/images; fi
              rm -f apex.zip
              chmod -R a+rX apex/images
              echo "APEX $APEX_VERSION images ready"
          envFrom:
            - configMapRef:
                name: ords-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: apex-images
              mountPath: /apex-images
            - name: tmp
              mountPath: /tmp
        # Writes the ORDS config for this pod
        - name: config
          image: __ORDS_IMAGE__
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              c="ords --config /etc/ords/config config"
              $c set db.hostname "$DB_HOST"
              $c set db.port "$DB_PORT"
              $c set db.servicename "$DB_SERVICE"
              grep -vE '^[[:space:]]*(#|$)' /etc/ords-settings/ords-settings.conf | while read -r key value; do
                $c set "$key" "$value"
              done
              $c set standalone.http.port 8080
              $c set standalone.https.port 8443
              $c set standalone.https.cert /run/secrets/ords-tls/tls.crt
              $c set standalone.https.cert.key /run/secrets/ords-tls/tls.key
              if [ -n "${APEX_VERSION:-}" ]; then
                $c set standalone.static.path /opt/oracle/apex-images/apex/images
              fi
              # https://<host>/ (no path) sends users on to APEX at /apps/
              docroot=/etc/ords/config/global/doc_root
              mkdir -p "$docroot"
              printf '%s\n' '<!DOCTYPE html>' '<html><head><meta charset="utf-8">' \
                '<meta http-equiv="refresh" content="0; url=/apps/"><title>Redirecting</title></head>' \
                '<body><a href="/apps/">Continue to the application</a></body></html>' > "$docroot/index.html"
              $c set standalone.doc.root "$docroot"
              pw=$(cat /run/secrets/ords-runtime/ORACLE_USER_PWD)
              printf '%s\n%s\n' "$pw" "$pw" | $c secret db.password
          envFrom:
            - configMapRef:
                name: ords-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/ords/config
            - name: tmp
              mountPath: /tmp
            - name: settings
              mountPath: /etc/ords-settings
              readOnly: true
            - name: runtime
              mountPath: /run/secrets/ords-runtime
              readOnly: true
      containers:
        - name: ords
          image: __ORDS_IMAGE__
          # Runs ORDS directly instead of the image's entrypoint, which would switch
          # Database Actions, REST-enabled SQL and the MongoDB API on at every start.
          command: ["ords", "--config", "/etc/ords/config", "serve"]
          env:
            # The ords launcher sets no heap size, so Java would default to a quarter of
            # the memory limit (768 MiB of 3 GiB). Give the heap 75%; the rest is for
            # Java's own memory and threads. deploy-ords.sh adds the database encryption
            # settings (DB_ENCRYPTION).
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=75 __DB_JAVA_OPTS__"
          ports:
            - name: https
              containerPort: 8443
            # ORDS also listens on 8080 for plain HTTP; nothing reaches it (the Service and
            # the network policy only allow 8443)
          # On shutdown, keep serving for a few seconds while the Service and MetalLB
          # stop sending new connections here, so rolling updates don't drop requests
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 3Gi
          # Probes use HTTPS with the real hostname: ORDS rejects HTTPS requests whose
          # Host doesn't match the certificate, and plain HTTP only redirects.
          # /apps/ answers as soon as ORDS is listening, even if the database is down.
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /apps/
              port: https
              httpHeaders:
                - name: Host
                  value: __ORDS_HOSTNAME__
            periodSeconds: 10
            failureThreshold: 30     # up to 5 minutes
          # The landing page returns 571 when ORDS can't reach the database,
          # so a pod only receives traffic while its connection pool works
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /apps/_/landing
              port: https
              httpHeaders:
                - name: Host
                  value: __ORDS_HOSTNAME__
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ords/config
            - name: tls
              mountPath: /run/secrets/ords-tls
              readOnly: true
            - name: apex-images
              mountPath: /opt/oracle/apex-images
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 64Mi
        - name: apex-images
          emptyDir:
            sizeLimit: 2Gi           # the zip and its unpacked images, about 770 MB at the peak
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi           # Java's temporary files, such as large uploads
        - name: settings
          configMap:
            name: ords-settings
        - name: runtime
          secret:
            secretName: ords-db-runtime
        - name: tls
          secret:
            secretName: ords-tls
            defaultMode: 0440        # readable by the oracle group (fsGroup), not others
---
# Keep at least one ORDS pod running during node drains and upgrades
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ords
  namespace: ords
  labels:
    app.kubernetes.io/name: ords
    app.kubernetes.io/part-of: ords
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ords
---
apiVersion: v1
kind: Service
metadata:
  name: ords
  namespace: ords
  labels:
    app.kubernetes.io/name: ords
    app.kubernetes.io/part-of: ords
  annotations:
    metallb.io/loadBalancerIPs: __LB_IP__
spec:
  type: LoadBalancer
  # MetalLB answers on the LAN IP directly, so no NodePorts need to be opened
  allocateLoadBalancerNodePorts: false
  # Who may connect to the LoadBalancer IP (enforced by kube-proxy): Cloudflare, which proxies
  # www.1apx.com from the internet through the router's port forward, and the three nodes,
  # for testing from k8-control. Anyone else who finds the public IP is refused, so
  # Cloudflare can't be bypassed. Not the whole LAN: some routers rewrite a forwarded
  # connection's source to their own LAN address, which would let anyone past this list.
  # Cloudflare's list: https://www.cloudflare.com/ips-v4 (ci/validate.sh checks this copy
  # against it, and the node addresses against node-prep.sh).
  loadBalancerSourceRanges:
    - 192.168.1.170/32       # k8-control
    - 192.168.1.171/32       # k8-worker-1
    - 192.168.1.172/32       # k8-worker-2
    - 173.245.48.0/20        # Cloudflare, from here on
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
  selector:
    app: ords
  # APEX keeps session state in the database, so either pod can serve any request.
  # Affinity is by connecting address, which for internet users is a Cloudflare edge
  # server: it still tends to keep a user on one pod with warm caches, and nothing
  # breaks when it changes.
  sessionAffinity: ClientIP
  ports:
    - name: https
      port: 443
      targetPort: https
