# Network policy for every pod in the ords namespace (ORDS, the preflight check and
# the install Job), enforced by Calico. Applied by deploy-ords.sh, which fills in the
# database port. Anything not listed is blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ords
  namespace: ords
  labels:
    app.kubernetes.io/part-of: ords
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # HTTPS, and HTTP that only redirects to it, from users through the Service
    - ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
  egress:
    # DNS through CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Oracle database
    - ports:
        - protocol: TCP
          port: __DB_PORT__
    # HTTPS, for the APEX images download from download.oracle.com
    - ports:
        - protocol: TCP
          port: 443
