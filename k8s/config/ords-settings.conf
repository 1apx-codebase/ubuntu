# ORDS settings, applied with "ords config set <key> <value>" in every ORDS pod at start.
# Copied from the existing ORDS server's settings.xml and pool.xml.
# Edit and run deploy-ords.sh again to apply. One "key value" per line.
#
# Set elsewhere, so not listed here:
#   db.hostname, db.port, db.servicename   -> DB_HOST, DB_PORT, DB_SERVICE in deploy-ords.sh
#   standalone.https.*                     -> the ords-tls Secret (from ../../ssl), port 8443
#   standalone.static.path                 -> the APEX images for APEX_VERSION
#   standalone.doc.root                    -> a page in each pod that redirects / to /apps/
#
# Left out on purpose:
#   standalone.https.port 443      the pod listens on 8443; the Service exposes 443
#   standalone.use.https, standalone.use.ssl.cert   old settings, not used by current ORDS
#   standalone.access.log                           a path on the old server
#   misc.compress (empty)
#   "default plsql.gateway.mode"   not a real setting (key "default")

# --- Connection pool (pool.xml) ---
db.connectionType basic
db.username ORDS_PUBLIC_USER
plsql.gateway.mode direct
security.requestValidationFunction ords_util.authorize_plsql_gateway
feature.sdw false
restEnabledSql.active false

# Connection pool size, per pod. The old single server used InitialLimit 30,
# MinLimit 50 and MaxLimit 300. With two pods, half of each keeps the same total.
jdbc.InitialLimit 15
jdbc.MinLimit 25
jdbc.MaxLimit 150
jdbc.CleanupMode dispose
jdbc.DriverType thin
jdbc.InactivityTimeout 1800
jdbc.MaxConnectionReuseCount 1000
jdbc.MaxStatementLimit 1000
jdbc.SessionTimeout 900

# --- Global (settings.xml) ---
# The old server had the Database API on; nothing uses it, and ORDS is now public, so it's off
database.api.enabled false
# Off by default, but stated so it stays off whatever starts ORDS
mongo.enabled false
debug.debugger false
debug.printDebugToScreen false
misc.defaultPage apex
security.forceHTTPS true
standalone.context.path /apps
standalone.static.context.path /i
