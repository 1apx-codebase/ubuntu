# The application's namespace. The name here is a placeholder: each environment overlay
# sets the real one with "namespace:", which renames this object too.
#
# Pod Security "restricted" is enforced: the API server refuses any pod here that runs as
# root, keeps capabilities, can escalate privileges, has no seccomp profile, or uses a
# host folder or other volume types outside the restricted list. The version is pinned to
# the cluster's minor version (ci/validate.sh checks it), so a Kubernetes upgrade can't
# tighten the rules unnoticed; raise it after upgrading.
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
