# ORDS for the portal: stateless replicas behind a MetalLB LAN IP, serving HTTPS with the
# *.1apx.com certificate. ORDS only serves here: nothing in this pod installs or upgrades the
# ORDS schema in the database. That's done out of band (README, "The database"), and the
# db-check step refuses to start ORDS against a schema that doesn't match its version.
#
# Each pod builds its own ORDS config in an emptyDir at start, from:
#   ords-db ConfigMap        the environment's database and host values (overlay's ords.env)
#   ords-settings ConfigMap  base ords-settings.conf plus the overlay's ords-pool.conf
#   ords-java ConfigMap      Java options: database encryption
#   ords-db-runtime Secret   ORDS_PUBLIC_USER password (created by deploy-ords.sh)
#   ords-tls Secret          certificate chain and private key (created by deploy-ords.sh)
# The values marked "set by the environment" are placeholders that the environment component
# (environment/kustomization.yaml) replaces. Every container has a read-only root filesystem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ords
  labels:
    app: ords
    app.kubernetes.io/name: ords
spec:
  replicas: 1                       # each overlay sets its own (replicas: in its kustomization.yaml)
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ords
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ords
        app.kubernetes.io/name: ords
      annotations:
        # kubectl logs and exec use the ORDS container unless told otherwise (-c access-log)
        kubectl.kubernetes.io/default-container: ords
    spec:
      # The database host name, resolved here rather than through DNS
      hostAliases:
        - ip: 192.0.2.1                   # set by the environment (DB_IP)
          hostnames: ["db.set-by-environment.invalid"]   # set by the environment (DB_HOST)
      automountServiceAccountToken: false   # ORDS doesn't use the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 54321            # "oracle" user in the ORDS image
        fsGroup: 54321
        seccompProfile:
          type: RuntimeDefault
      # Prefer one replica per worker. ScheduleAnyway (not DoNotSchedule) lets both run
      # on one worker while the other is drained or down, instead of one staying Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ords
      initContainers:
        # Checks the database before ORDS starts: logs in as ORDS_PUBLIC_USER, refuses to go on
        # if the ORDS schema there doesn't match this image's ORDS version (ORDS_VER, set by the
        # image), and records the APEX version for the next step. If it fails, the pod never
        # becomes ready, so during a rollout the old pods keep serving.
        - name: db-check
          image: container-registry.oracle.com/database/ords
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              : "${ORDS_VER:?is not set by this image, so its ORDS version is unknown}"
              APEX_VERSION=${APEX_VERSION:-}
              pw=$(cat /run/secrets/ords-runtime/ORACLE_USER_PWD)
              out=$(sql -S -L /nolog 2>&1 <<SQL
              whenever sqlerror exit failure
              connect ORDS_PUBLIC_USER/"${pw}"@//${DB_HOST}:${DB_PORT}/${DB_SERVICE}
              set heading off feedback off pagesize 0 verify off
              select 'LOGIN_OK' from dual;
              whenever sqlerror continue
              select 'ORDS_VERSION=' || version from ords_metadata.ords_version;
              select 'APEX_VERSION=' || version_no from apex_release;
              exit
              SQL
              )
              if ! grep -q '^LOGIN_OK' <<<"$out"; then
                echo "$out" | tail -20
                echo "Can't log in to $DB_HOST:$DB_PORT/$DB_SERVICE as ORDS_PUBLIC_USER (see above)."
                exit 1
              fi
              db_ords=$(sed -n 's/^ORDS_VERSION=\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' <<<"$out" | head -1)
              db_apex=$(sed -n 's/^APEX_VERSION=\([0-9]*\.[0-9]*\).*/\1/p' <<<"$out" | head -1)
              if [ "$db_ords" != "$ORDS_VER" ]; then
                echo "The database's ORDS schema is ${db_ords:-not installed}, but this image is ORDS $ORDS_VER."
                echo "ORDS only serves here and never installs or upgrades the schema: have it installed"
                echo "or upgraded out of band, or set the overlay's image to the schema's version."
                exit 1
              fi
              apex=${APEX_VERSION:-$db_apex}
              if [ -n "$APEX_VERSION" ] && [ -n "$db_apex" ] && [ "$db_apex" != "$APEX_VERSION" ]; then
                echo "WARNING: APEX_VERSION is $APEX_VERSION, but the database has APEX $db_apex."
              fi
              printf '%s' "$apex" > /apex-images/.apex-version
              echo "Logged in. ORDS schema $db_ords matches the image. APEX: ${apex:-none}."
          env:
            - name: JDK_JAVA_OPTIONS
              value: "$(DB_JAVA_OPTS)"
          envFrom:
            - configMapRef:
                name: ords-db
            - configMapRef:
                name: ords-java
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: runtime
              mountPath: /run/secrets/ords-runtime
              readOnly: true
            - name: apex-images
              mountPath: /apex-images
            - name: tmp
              mountPath: /tmp
            - name: home                # SQLcl keeps its history and settings in the home folder
              mountPath: /home/oracle
        # APEX static images (/i/) for the version db-check found (or APEX_VERSION), downloaded
        # from Oracle into this pod's apex-images volume (about 290 MB; 480 MB unpacked)
        - name: apex-images
          image: container-registry.oracle.com/database/ords
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              v=$(cat /apex-images/.apex-version)
              if [ -z "$v" ]; then echo "No APEX version, so no APEX images"; exit 0; fi
              cd /apex-images
              echo "Downloading APEX $v images..."
              curl -fsSL --retry 3 -o apex.zip "https://download.oracle.com/otn_software/apex/apex_${v}.zip"
              if command -v unzip >/dev/null; then unzip -q apex.zip 'apex/images/*'; else jar xf apex.zip apex/images; fi
              rm -f apex.zip
              chmod -R a+rX apex/images
              echo "APEX $v images ready"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: apex-images
              mountPath: /apex-images
            - name: tmp
              mountPath: /tmp
        # Writes the ORDS config for this pod
        - name: config
          image: container-registry.oracle.com/database/ords
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              c="ords --config /etc/ords/config config"
              $c set db.hostname "$DB_HOST"
              $c set db.port "$DB_PORT"
              $c set db.servicename "$DB_SERVICE"
              # Every settings file: the base's ords-settings.conf, then the overlay's ords-pool.conf
              for f in /etc/ords-settings/*.conf; do
                grep -vE '^[[:space:]]*(#|$)' "$f" | while read -r key value; do
                  $c set "$key" "$value"
                done
              done
              $c set standalone.http.port 8080
              $c set standalone.https.port 8443
              $c set standalone.https.cert /run/secrets/ords-tls/tls.crt
              $c set standalone.https.cert.key /run/secrets/ords-tls/tls.key
              if [ -s /opt/oracle/apex-images/.apex-version ]; then
                $c set standalone.static.path /opt/oracle/apex-images/apex/images
              fi
              # https://<host>/ (no path) sends users on to APEX at /apps/
              docroot=/etc/ords/config/global/doc_root
              mkdir -p "$docroot"
              printf '%s\n' '<!DOCTYPE html>' '<html><head><meta charset="utf-8">' \
                '<meta http-equiv="refresh" content="0; url=/apps/"><title>Redirecting</title></head>' \
                '<body><a href="/apps/">Continue to the application</a></body></html>' > "$docroot/index.html"
              $c set standalone.doc.root "$docroot"
              # Access log: one file a day in the access-log volume, kept 2 days; the
              # access-log sidecar prints it (kubectl logs -c access-log)
              $c set standalone.access.log /var/log/ords
              $c set standalone.access.log.retainDays 2
              pw=$(cat /run/secrets/ords-runtime/ORACLE_USER_PWD)
              printf '%s\n%s\n' "$pw" "$pw" | $c secret db.password
          envFrom:
            - configMapRef:
                name: ords-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/ords/config
            - name: tmp
              mountPath: /tmp
            - name: settings
              mountPath: /etc/ords-settings
              readOnly: true
            - name: runtime
              mountPath: /run/secrets/ords-runtime
              readOnly: true
            - name: apex-images
              mountPath: /opt/oracle/apex-images
              readOnly: true
        # Sidecar (runs alongside ORDS): prints ORDS's access log, one file a day, so
        # "kubectl logs -c access-log" shows every request. Follows the newest file.
        - name: access-log
          image: container-registry.oracle.com/database/ords
          restartPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              cd /var/log/ords
              cur= pid=
              trap '[ -z "$pid" ] || kill "$pid"; exit 0' TERM
              while :; do
                new=$(ls -1 ords_*.log 2>/dev/null | tail -1)
                if [ -n "$new" ] && [ "$new" != "$cur" ]; then
                  [ -z "$pid" ] || kill "$pid" 2>/dev/null
                  tail -n +1 -F "$new" & pid=$!
                  cur=$new
                fi
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: access-log
              mountPath: /var/log/ords
              readOnly: true
      containers:
        - name: ords
          image: container-registry.oracle.com/database/ords
          # "ords serve" only: it never installs or upgrades the ORDS schema. Run directly, not
          # through the image's entrypoint, which would install the schema when given a SYS
          # password and switch Database Actions, REST-enabled SQL and the MongoDB API on.
          command: ["ords", "--config", "/etc/ords/config", "serve"]
          env:
            # The ords launcher sets no heap size, so Java would default to a quarter of
            # the memory limit (768 MiB of 3 GiB). Give the heap 75%; the rest is for
            # Java's own memory and threads. DB_JAVA_OPTS: database encryption (ords-java).
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=75 $(DB_JAVA_OPTS)"
          envFrom:
            - configMapRef:
                name: ords-java
          ports:
            - name: https
              containerPort: 8443
            # ORDS also listens on 8080 for plain HTTP; nothing reaches it (the Service and
            # the network policy only allow 8443)
          # On shutdown, keep serving for a few seconds while the Service and MetalLB
          # stop sending new connections here, so rolling updates don't drop requests
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 3Gi
          # Probes use HTTPS with the real hostname: ORDS rejects HTTPS requests whose
          # Host doesn't match the certificate, and plain HTTP only redirects.
          # /apps/ answers as soon as ORDS is listening, even if the database is down.
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /apps/
              port: https
              httpHeaders:
                - name: Host
                  value: host.set-by-environment.invalid   # set by the environment (ORDS_HOSTNAME)
            periodSeconds: 10
            failureThreshold: 30     # up to 5 minutes
          # The landing page returns 571 when ORDS can't reach the database,
          # so a pod only receives traffic while its connection pool works
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /apps/_/landing
              port: https
              httpHeaders:
                - name: Host
                  value: host.set-by-environment.invalid   # set by the environment (ORDS_HOSTNAME)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ords/config
            - name: tls
              mountPath: /run/secrets/ords-tls
              readOnly: true
            - name: apex-images
              mountPath: /opt/oracle/apex-images
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: access-log
              mountPath: /var/log/ords
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 64Mi
        - name: apex-images
          emptyDir:
            sizeLimit: 2Gi           # the zip and its unpacked images, about 770 MB at the peak
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi           # Java's temporary files, such as large uploads
        - name: home
          emptyDir:
            sizeLimit: 64Mi
        - name: access-log
          emptyDir:
            sizeLimit: 1Gi           # two days of access log
        - name: settings
          configMap:
            name: ords-settings
        - name: runtime
          secret:
            secretName: ords-db-runtime
        - name: tls
          secret:
            secretName: ords-tls
            defaultMode: 0440        # readable by the oracle group (fsGroup), not others
