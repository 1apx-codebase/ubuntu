  <text x="500.0" y="511.8" font-size="15" text-anchor="middle" fill="#4b5563">tainted: runs no workloads</text>
  <rect x="648" y="468" width="262" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="779.0" y="490.8" font-size="15" text-anchor="middle" fill="#4b5563">etcd backups</text>
  <text x="779.0" y="511.8" font-size="15" text-anchor="middle" fill="#4b5563">daily, kept 14 days</text>
  <text x="500.0" y="548" font-size="14" text-anchor="middle" font-style="italic" fill="#4b5563">ufw: SSH and the Kubernetes API from the LAN only</text>
  <rect x="70" y="596" width="860" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500.0" y="626.0" font-size="17" text-anchor="middle" font-weight="bold">Service ords · LoadBalancer · 192.168.1.180</text>
  <text x="500.0" y="648.0" font-size="15" text-anchor="middle" fill="#4b5563">MetalLB layer 2 · admits only Cloudflare and the LAN</text>
  <text x="500.0" y="670.0" font-size="15" text-anchor="middle" fill="#4b5563">:443 → pods 8443 (HTTPS) · :80 → 8080 (redirects to HTTPS)</text>
