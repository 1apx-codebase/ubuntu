  <rect x="690" y="214" width="280" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="830.0" y="243.9" font-size="17" text-anchor="middle" font-weight="bold">Router 192.168.1.1</text>
  <text x="830.0" y="267.9" font-size="15" text-anchor="middle" fill="#4b5563">port 443 → 192.168.1.180</text>
