# Runs ci/validate.sh on every push and pull request.
name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pinned by commit, not tag, so the action can't change under us
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # gitleaks scans the whole history
          persist-credentials: false
      - name: Install Python's yaml module
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml
      - name: Validate
        run: ci/validate.sh
